<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Mart</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🛒 Local Mart
        </a>

        <div class="d-flex align-items-center">

            <a class="btn btn-light me-2" href="/">
                Home
            </a>

            {% if user.is_authenticated %}

                <a class="btn btn-light me-2" href="/products/">
                    Products
                </a>

                <a class="btn btn-warning me-2" href="/cart/">
                    🛒 Cart
                </a>

                <a class="btn btn-info me-2" href="/orders/">
                    📦 Orders
                </a>

                <a class="btn btn-secondary me-2" href="/accounts/profile/">
                    👤 Profile
                </a>

                <span class="text-white me-3">
                    Welcome, {{ user.username }}
                </span>
                <a class="btn btn-primary me-2" href="/orders/notifications/">
                    🔔 Notifications
                </a>

                <a class="btn btn-danger" href="/accounts/logout/">
                    Logout
                </a>

            {% else %}

                <a class="btn btn-primary me-2" href="/accounts/register/">
                    Register
                </a>

                <a class="btn btn-outline-light" href="/accounts/login/">
                    Login
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
